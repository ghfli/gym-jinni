stages:
  - build
  - test
  - deploy

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  STORAGE_DRIVER: vfs

.build_template: &build_template
  stage: build
  image: quay.io/podman/stable
  privileged: true
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | podman login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - podman build -f k8s-setup/container/Dockerfile.$SERVICE -t $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHORT_SHA .
    - podman tag $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/$SERVICE:latest
    - podman push $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHORT_SHA
    - podman push $CI_REGISTRY_IMAGE/$SERVICE:latest
  only:
    - main
    - master
    - csr

build:service:
  <<: *build_template
  variables:
    SERVICE: service

build:ui:
  <<: *build_template
  variables:
    SERVICE: ui

test:integration:
  stage: test
  image: quay.io/podman/stable
  privileged: true
  script:
    - podman build -f k8s-setup/container/Dockerfile.service -t gym-jinni/service:ci-test .
  only:
    - main
    - master
    - csr

test:deployment:
  stage: test
  image: python:3.12-slim
  script:
    - python -m pip install -r k8s-setup/tests/requirements.txt
    - python -m unittest discover -s k8s-setup/tests -v
  only:
    - main
    - master
    - csr

deploy:kubernetes:
  stage: deploy
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - curl -fsSLo /tmp/kubectl https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl
    - curl -fsSLo /tmp/kubectl.sha256 https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl.sha256
    - bash -ec 'printf "%s  /tmp/kubectl\n" "$(cat /tmp/kubectl.sha256)" | sha256sum --check'
    - install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
    - python -m pip install -r k8s-setup/tests/requirements.txt
    - bash k8s-setup/scripts/check-deployment-tools.sh
    - export KUBECONFIG=/tmp/gym-jinni-kubeconfig
    - chmod 600 "$KUBECONFIG"
    - export KUBECONFIG_BASE64="$KUBECONFIG_CONTENT"
    - bash k8s-setup/scripts/configure-kubectl.sh
  script:
    - python k8s-setup/scripts/render-release.py --profile remote --domain "$GYM_JINNI_DOMAIN" --service-image "$CI_REGISTRY_IMAGE/service:$CI_COMMIT_SHORT_SHA" --ui-image "$CI_REGISTRY_IMAGE/ui:$CI_COMMIT_SHORT_SHA" --pull-secret "${REGISTRY_PULL_SECRET:-}" --output /tmp/gym-jinni-release
    - bash k8s-setup/scripts/deploy-release.sh /tmp/gym-jinni-release
  after_script:
    - rm -f /tmp/gym-jinni-kubeconfig
  only:
    - main
    - master
  when: manual
