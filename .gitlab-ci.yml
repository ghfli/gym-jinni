stages:
  - build
  - test
  - deploy

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  STORAGE_DRIVER: vfs

.build_template: &build_template
  stage: build
  image: quay.io/podman/stable
  privileged: true
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | podman login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - podman build -f k8s-setup/container/Dockerfile.$SERVICE -t $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHORT_SHA .
    - podman tag $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/$SERVICE:latest
    - podman push $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHORT_SHA
    - podman push $CI_REGISTRY_IMAGE/$SERVICE:latest
  only:
    - main
    - master
    - csr

build:service:
  <<: *build_template
  variables:
    SERVICE: service

build:ui:
  <<: *build_template
  variables:
    SERVICE: ui

test:integration:
  stage: test
  image: quay.io/podman/stable
  privileged: true
  script:
    - podman build -f k8s-setup/container/Dockerfile.service -t gym-jinni/service:ci-test .
  only:
    - main
    - master
    - csr

test:deployment:
  stage: test
  image: python:3.12-slim
  script:
    - python -m pip install -r k8s-setup/tests/requirements.txt
    - python -m unittest discover -s k8s-setup/tests -v
  only:
    - main
    - master
    - csr

deploy:kubernetes:
  stage: deploy
  # Pinned digest for bitnami/kubectl:latest (multi-arch manifest) — bump when upgrading kubectl/Kubernetes.
  image:
    name: bitnami/kubectl@sha256:3a8ef2eba6186625bef5d59129e8118abeba5072d104c6f03e3167a9b1070ae2
    entrypoint: [""]
  before_script:
    - command -v bash >/dev/null || { echo 'Deployment image requires bash'; exit 1; }
    - bash k8s-setup/scripts/check-deployment-tools.sh
    - mkdir -p $HOME/.kube
    - echo "$KUBECONFIG_CONTENT" | base64 -d > $HOME/.kube/config
  script:
    - kubectl apply -f k8s-setup/manifests/namespace.yml
    - bash k8s-setup/scripts/ensure-jwt-secret.sh
    - kubectl apply -f k8s-setup/manifests/secrets.yml
    - kubectl apply -f k8s-setup/manifests/configmaps.yml
    - kubectl apply -f k8s-setup/manifests/postgres-statefulset.yml
    - kubectl apply -f k8s-setup/manifests/main-service-deployment.yml
    - kubectl apply -f k8s-setup/manifests/ui-deployment.yml
    - kubectl apply -f k8s-setup/manifests/ingress.yml
    - kubectl rollout status deployment/main-service -n gym-jinni
    - kubectl rollout status deployment/ui -n gym-jinni
  only:
    - main
    - master
  when: manual
