name: Build and Deploy to K8s

on:
  push:
    branches: [ main, master, csr ]
  pull_request:
    branches: [ main, master, csr ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [service, ui]
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push container image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: k8s-setup/container/Dockerfile.${{ matrix.service }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.28.0'

    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

    - name: Install cert-manager
      run: |
        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.17.2/cert-manager.yaml
        kubectl wait --for=condition=ready pod -l app.kubernetes.io/instance=cert-manager \
          -n cert-manager --timeout=120s

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s-setup/manifests/namespace.yml
        kubectl apply -f k8s-setup/manifests/secrets.yml
        kubectl apply -f k8s-setup/manifests/configmaps.yml
        kubectl apply -f k8s-setup/manifests/postgres-statefulset.yml
        kubectl apply -f k8s-setup/manifests/main-service-deployment.yml
        kubectl apply -f k8s-setup/manifests/ui-deployment.yml
        kubectl apply -f k8s-setup/manifests/cluster-issuer.yml
        kubectl apply -f k8s-setup/manifests/ingress.yml

    - name: Wait for deployments
      run: |
        kubectl wait --for=condition=ready pod -l app=postgres -n gym-jinni --timeout=300s
        kubectl wait --for=condition=ready pod -l app=main-service -n gym-jinni --timeout=300s
        kubectl wait --for=condition=ready pod -l app=ui -n gym-jinni --timeout=300s

    - name: Verify deployment
      run: |
        kubectl get pods -n gym-jinni
        kubectl get svc -n gym-jinni
        kubectl get ingress -n gym-jinni
