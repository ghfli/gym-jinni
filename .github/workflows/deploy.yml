name: Build and Deploy to K8s

on:
  push:
    branches: [ main, master, csr ]
  pull_request:
    branches: [ main, master, csr ]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the configured Kubernetes cluster after building
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [service, ui]
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Test deployment guards and cert-manager readiness
      if: matrix.service == 'service'
      run: |
        python3 -m venv "$RUNNER_TEMP/deployment-tests"
        "$RUNNER_TEMP/deployment-tests/bin/python" -m pip install -r k8s-setup/tests/requirements.txt
        "$RUNNER_TEMP/deployment-tests/bin/python" -m unittest discover -s k8s-setup/tests -v

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push container image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: k8s-setup/container/Dockerfile.${{ matrix.service }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest

  deploy:
    concurrency:
      group: gym-jinni-deployment
      cancel-in-progress: false
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up kubectl
      uses: azure/setup-kubectl@v5
      with:
        version: 'v1.28.0'

    - name: Configure and verify Kubernetes access
      env:
        KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG }}
      run: |
        export KUBECONFIG="$RUNNER_TEMP/gym-jinni-kubeconfig"
        printf 'KUBECONFIG=%s\n' "$KUBECONFIG" >> "$GITHUB_ENV"
        bash k8s-setup/scripts/configure-kubectl.sh

    - name: Render immutable release
      env:
        GYM_JINNI_DOMAIN: ${{ vars.GYM_JINNI_DOMAIN }}
        REGISTRY_PULL_SECRET: ${{ vars.REGISTRY_PULL_SECRET }}
      run: |
        python3 -m venv "$RUNNER_TEMP/release-tools"
        "$RUNNER_TEMP/release-tools/bin/python" -m pip install -r k8s-setup/tests/requirements.txt
        "$RUNNER_TEMP/release-tools/bin/python" k8s-setup/scripts/render-release.py \
          --profile remote --domain "$GYM_JINNI_DOMAIN" \
          --service-image "$REGISTRY/$IMAGE_PREFIX/service:${{ github.sha }}" \
          --ui-image "$REGISTRY/$IMAGE_PREFIX/ui:${{ github.sha }}" \
          --pull-secret "$REGISTRY_PULL_SECRET" --output "$RUNNER_TEMP/release"

    - name: Deploy after successful release migration
      env:
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
      run: bash k8s-setup/scripts/deploy-release.sh "$RUNNER_TEMP/release"

    - name: Verify deployment
      run: |
        kubectl get pods -n gym-jinni
        kubectl get svc -n gym-jinni
        kubectl get ingress -n gym-jinni

    - name: Remove deployment credentials
      if: always()
      run: rm -f "${KUBECONFIG:-$RUNNER_TEMP/gym-jinni-kubeconfig}"
