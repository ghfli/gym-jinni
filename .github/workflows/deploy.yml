name: Build and Deploy to K8s

on:
  push:
    branches: [ main, master, csr ]
  pull_request:
    branches: [ main, master, csr ]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the configured Kubernetes cluster after building
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [service, ui]
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Test deployment guards and cert-manager readiness
      if: matrix.service == 'service'
      run: python3 -m unittest discover -s k8s-setup/tests -v

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push container image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: k8s-setup/container/Dockerfile.${{ matrix.service }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up kubectl
      uses: azure/setup-kubectl@v5
      with:
        version: 'v1.28.0'

    - name: Configure and verify Kubernetes access
      env:
        KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG }}
      run: |
        export KUBECONFIG="$RUNNER_TEMP/gym-jinni-kubeconfig"
        printf 'KUBECONFIG=%s\n' "$KUBECONFIG" >> "$GITHUB_ENV"
        bash k8s-setup/scripts/configure-kubectl.sh

    - name: Install cert-manager
      run: bash k8s-setup/scripts/install-cert-manager.sh

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s-setup/manifests/namespace.yml
        kubectl apply -f k8s-setup/manifests/secrets.yml
        kubectl apply -f k8s-setup/manifests/configmaps.yml
        kubectl apply -f k8s-setup/manifests/postgres-statefulset.yml
        kubectl apply -f k8s-setup/manifests/main-service-deployment.yml
        kubectl apply -f k8s-setup/manifests/ui-deployment.yml
        kubectl apply -f k8s-setup/manifests/cluster-issuer.yml
        kubectl apply -f k8s-setup/manifests/ingress.yml

    - name: Wait for deployments
      run: |
        kubectl wait --for=condition=ready pod -l app=postgres -n gym-jinni --timeout=300s
        kubectl wait --for=condition=ready pod -l app=main-service -n gym-jinni --timeout=300s
        kubectl wait --for=condition=ready pod -l app=ui -n gym-jinni --timeout=300s

    - name: Verify deployment
      run: |
        kubectl get pods -n gym-jinni
        kubectl get svc -n gym-jinni
        kubectl get ingress -n gym-jinni

    - name: Remove deployment credentials
      if: always()
      run: rm -f "${KUBECONFIG:-$RUNNER_TEMP/gym-jinni-kubeconfig}"
