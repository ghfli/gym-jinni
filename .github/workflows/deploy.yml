name: Build and Deploy to K8s

on:
  push:
    branches: [ main, master, csr ]
  pull_request:
    branches: [ main, master, csr ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [service, ui]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Podman
      run: |
        sudo apt-get update
        sudo apt-get install -y podman

    - name: Build container image
      run: |
        SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
        IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}"
        podman build -f "k8s-setup/container/Dockerfile.${{ matrix.service }}" -t "$IMAGE:$SHORT" .

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

    - name: Push container image
      if: github.event_name != 'pull_request'
      run: |
        SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
        IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}"
        podman tag "$IMAGE:$SHORT" "$IMAGE:latest"
        podman push "$IMAGE:$SHORT"
        podman push "$IMAGE:latest"

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s-setup/manifests/namespace.yml
        kubectl apply -f k8s-setup/manifests/secrets.yml
        kubectl apply -f k8s-setup/manifests/configmaps.yml
        kubectl apply -f k8s-setup/manifests/postgres-statefulset.yml
        kubectl apply -f k8s-setup/manifests/main-service-deployment.yml
        kubectl apply -f k8s-setup/manifests/ui-deployment.yml
        kubectl apply -f k8s-setup/manifests/ingress.yml

    - name: Wait for deployments
      run: |
        kubectl wait --for=condition=ready pod -l app=postgres -n gym-jinni --timeout=300s
        kubectl wait --for=condition=ready pod -l app=main-service -n gym-jinni --timeout=300s
        kubectl wait --for=condition=ready pod -l app=ui -n gym-jinni --timeout=300s

    - name: Verify deployment
      run: |
        kubectl get pods -n gym-jinni
        kubectl get svc -n gym-jinni
        kubectl get ingress -n gym-jinni
