version: 2
sql:
  - schema: "../../gen/sql/rbac.dbml.sql"
    queries: "rbac.sqlc.sql"
    engine: "postgresql"
    gen:
      go:
        package: "rbacv1alpha"
        out: "../../gen/go/rbac/v1alpha"
        output_db_file_name: "rbac.sqlc.db.go"
        output_models_file_name: "rbac.sqlc.model.go"
        output_querier_file_name: "rbac.sqlc.sql.go"

