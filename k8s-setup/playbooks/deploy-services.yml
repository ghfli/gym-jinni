---
- name: Build Docker images for gym-jinni services
  hosts: localhost
  gather_facts: yes
  roles:
    - role: build-images
      tags: ['build', 'images']

- name: Deploy gym-jinni services to Kubernetes
  hosts: localhost
  gather_facts: yes
  roles:
    - role: gym-jinni
      tags: ['deploy', 'services']

- name: Verify deployment
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Wait for PostgreSQL to be ready
      shell: |
        export KUBECONFIG=$HOME/.kube/gym-jinni-config
        kubectl wait --for=condition=ready pod -l app=postgres -n gym-jinni --timeout=300s
      tags: ['verify']

    - name: Wait for services to be ready
      shell: |
        export KUBECONFIG=$HOME/.kube/gym-jinni-config
        kubectl wait --for=condition=ready pod -l app={{ item }} -n gym-jinni --timeout=300s
      loop:
        - csr-service
        - main-service
        - ui
      tags: ['verify']

    - name: Display service endpoints
      shell: |
        export KUBECONFIG=$HOME/.kube/gym-jinni-config
        kubectl get svc -n gym-jinni
      register: services_output
      changed_when: false
      tags: ['verify']

    - name: Show services
      debug:
        msg: "{{ services_output.stdout_lines }}"
      tags: ['verify']

