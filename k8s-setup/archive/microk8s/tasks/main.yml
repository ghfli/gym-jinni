---
- name: Check if MicroK8s is already installed
  shell: podman exec {{ container_name }} which microk8s
  register: microk8s_check
  failed_when: false
  changed_when: false

- name: Create AppArmor workaround for snap
  shell: |
    podman exec {{ container_name }} bash -c '
      # Create fake aa-enabled command
      echo -e "#!/bin/bash\nexit 0" > /usr/sbin/aa-enabled
      chmod +x /usr/sbin/aa-enabled
      
      # Create fake aa_is_enabled function
      mkdir -p /usr/lib/snapd
      echo -e "#!/bin/bash\nexit 0" > /usr/lib/snapd/aa_is_enabled
      chmod +x /usr/lib/snapd/aa_is_enabled
      
      # Create fake aa-exec
      ln -sf /bin/true /usr/sbin/aa-exec 2>/dev/null || true
      
      # Create AppArmor status file to indicate AppArmor is disabled
      mkdir -p /sys/module/apparmor/parameters
      echo "N" > /sys/module/apparmor/parameters/enabled 2>/dev/null || true
      
      # Unload apparmor module if possible
      modprobe -r apparmor 2>/dev/null || true
    '
  when: microk8s_check.rc != 0
  changed_when: false
  ignore_errors: yes

- name: Install devmode snap support
  shell: |
    podman exec {{ container_name }} bash -c '
      export SNAPPY_TESTING=1
      export SNAPD_DEBUG=1
    '
  when: microk8s_check.rc != 0
  changed_when: false
  ignore_errors: yes

- name: Install MicroK8s via snap (try classic mode first)
  shell: podman exec {{ container_name }} snap install microk8s --classic --channel={{ microk8s_version }}
  when: microk8s_check.rc != 0
  register: microk8s_install_classic
  failed_when: false
  changed_when: microk8s_install_classic.rc == 0

- name: Install MicroK8s via snap (fallback to devmode)
  shell: podman exec {{ container_name }} snap install microk8s --devmode --channel={{ microk8s_version }}
  when: microk8s_check.rc != 0 and microk8s_install_classic.rc != 0
  register: microk8s_install
  retries: 3
  delay: 10
  until: microk8s_install.rc == 0

- name: Wait for MicroK8s to be ready
  shell: podman exec {{ container_name }} microk8s status --wait-ready
  retries: 20
  delay: 10
  register: result
  until: result.rc == 0

- name: Enable required MicroK8s addons (control plane only)
  shell: podman exec {{ container_name }} microk8s enable {{ item }}
  loop:
    - dns
    - storage
    - ingress
    - metrics-server
  when: is_control_plane | default(false)
  register: addon_enable
  changed_when: "'is already enabled' not in addon_enable.stdout"
  retries: 3
  delay: 5
  until: addon_enable.rc == 0

- name: Configure firewall rules for MicroK8s
  shell: |
    podman exec {{ container_name }} bash -c "
    iptables -P FORWARD ACCEPT
    iptables -P INPUT ACCEPT
    iptables -P OUTPUT ACCEPT
    "
  changed_when: false

- name: Add microk8s alias to bashrc
  shell: podman exec {{ container_name }} bash -c "echo \"alias kubectl='microk8s kubectl'\" >> /root/.bashrc"
  changed_when: false

- name: Display MicroK8s status
  shell: podman exec {{ container_name }} microk8s status
  register: mk8s_status
  changed_when: false

- name: Show status
  debug:
    msg: "{{ mk8s_status.stdout_lines }}"

