apiVersion: v1
kind: Service
metadata:
  name: main-service
  namespace: gym-jinni
  labels:
    app: main-service
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    name: grpc
  - port: 8081
    targetPort: 8081
    nodePort: 30081
    name: http
  selector:
    app: main-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-service
  namespace: gym-jinni
  labels:
    app: main-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-service
  template:
    metadata:
      labels:
        app: main-service
    spec:
      initContainers:
      - name: wait-for-postgres
        image: postgres:15-alpine
        command: ["/bin/sh", "-ec"]
        args:
          - |
            attempt=0
            until pg_isready --timeout=2; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 60 ]; then
                echo "PostgreSQL did not become ready after 60 checks" >&2
                exit 1
              fi
              sleep 2
            done
        env:
        - name: PGHOST
          valueFrom:
            configMapKeyRef:
              name: gym-jinni-config
              key: POSTGRES_HOST
        - name: PGPORT
          valueFrom:
            configMapKeyRef:
              name: gym-jinni-config
              key: POSTGRES_PORT
        - name: PGDATABASE
          valueFrom:
            configMapKeyRef:
              name: gym-jinni-config
              key: POSTGRES_DB
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
      - name: run-migrations
        image: gym-jinni/service:latest
        imagePullPolicy: Never
        command: ["/bin/sh", "-ec"]
        args:
          - exec migrate -path /app/service/mig -database "${DBURL}" up
        env:
        - name: DBURL
          valueFrom:
            configMapKeyRef:
              name: gym-jinni-config
              key: DBURL
      containers:
      - name: main-service
        image: gym-jinni/service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: grpc
        - containerPort: 8081
          name: http
        env:
        - name: DBURL
          valueFrom:
            configMapKeyRef:
              name: gym-jinni-config
              key: DBURL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: gym-jinni-auth
              key: JWT_SECRET
              optional: false
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

