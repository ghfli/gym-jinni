# The backend signing Secret gym-jinni-auth is provisioned once by
# k8s-setup/scripts/ensure-jwt-secret.sh, never committed as a shared key.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: gym-jinni
type: Opaque
stringData:
  POSTGRES_USER: root
  POSTGRES_PASSWORD: gj
  POSTGRES_DB: gj

