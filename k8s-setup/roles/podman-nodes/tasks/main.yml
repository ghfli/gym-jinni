---
- name: Install Podman if not present
  package:
    name:
      - podman
      - slirp4netns
    state: present
  become: yes

- name: Remove existing Podman network if present
  shell: podman network rm -f {{ pod_network }} || true
  changed_when: false
  ignore_errors: yes

- name: Create Podman network for K8s cluster
  shell: |
    podman network create \
      --driver bridge \
      --subnet {{ pod_subnet }} \
      --gateway {{ pod_gateway }} \
      {{ pod_network }}
  register: network_create
  failed_when: network_create.rc != 0 and 'already exists' not in network_create.stderr
  changed_when: network_create.rc == 0

- name: Copy CNI config fix script
  copy:
    src: fix_cni_config.py
    dest: /tmp/fix_cni_config.py
    mode: '0755'

- name: Fix CNI version for firewall plugin compatibility in user directory
  shell: |
    CNI_FILE="$HOME/.config/cni/net.d/{{ pod_network }}.conflist"
    if [ -f "$CNI_FILE" ]; then
      python3 /tmp/fix_cni_config.py "$CNI_FILE"
    fi
  when: network_create.changed
  changed_when: false

- name: Fix CNI version for firewall plugin compatibility in system directory
  shell: |
    CNI_FILE="/etc/cni/net.d/{{ pod_network }}.conflist"
    if [ -f "$CNI_FILE" ]; then
      python3 /tmp/fix_cni_config.py "$CNI_FILE"
    fi
  when: network_create.changed
  become: yes
  changed_when: false

- name: Remove existing containers if present
  shell: podman rm -f gym-jinni-node1 gym-jinni-node2 gym-jinni-node3 2>/dev/null || true
  changed_when: false

- name: Create systemd-enabled Podman containers for K8s nodes
  shell: |
    podman run -d \
      --name {{ item.name }} \
      --hostname {{ item.name }} \
      --network {{ pod_network }} \
      --ip {{ item.ip }} \
      --privileged \
      --systemd=always \
      --cgroupns=host \
      --security-opt apparmor=unconfined \
      --security-opt seccomp=unconfined \
      -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
      -v /lib/modules:/lib/modules:ro \
      -v {{ item.name }}-data:/var/lib/microk8s:Z \
      -p {{ item.grpc_port }}:{{ item.grpc_port }} \
      -p {{ item.http_port }}:{{ item.http_port }} \
      docker.io/jrei/systemd-ubuntu:22.04 \
      /lib/systemd/systemd
  loop:
    - { name: 'gym-jinni-node1', ip: '10.91.0.11', grpc_port: '8080', http_port: '8081' }
    - { name: 'gym-jinni-node2', ip: '10.91.0.12', grpc_port: '8082', http_port: '8083' }
    - { name: 'gym-jinni-node3', ip: '10.91.0.13', grpc_port: '16443', http_port: '8000' }
  register: container_create
  failed_when: container_create.rc != 0 and 'already exists' not in container_create.stderr
  changed_when: container_create.rc == 0

- name: Wait for containers to be ready
  shell: podman exec {{ item }} systemctl is-system-running --wait
  loop:
    - gym-jinni-node1
    - gym-jinni-node2
    - gym-jinni-node3
  retries: 10
  delay: 3
  register: result
  until: result.rc == 0 or 'degraded' in result.stdout

- name: Install required packages in containers
  shell: |
    podman exec {{ item }} bash -c "
      apt-get update && \
      apt-get install -y \
        snapd \
        systemd \
        systemd-sysv \
        curl \
        iptables \
        iproute2 \
        ca-certificates \
        gnupg \
        lsb-release \
        apparmor \
        apparmor-utils
    "
  loop:
    - gym-jinni-node1
    - gym-jinni-node2
    - gym-jinni-node3
  register: pkg_install
  changed_when: "'0 upgraded, 0 newly installed' not in pkg_install.stdout"

- name: Stop AppArmor service in containers
  shell: |
    podman exec {{ item }} bash -c "
      systemctl stop apparmor || true
      systemctl disable apparmor || true
    "
  loop:
    - gym-jinni-node1
    - gym-jinni-node2
    - gym-jinni-node3
  changed_when: false
  ignore_errors: yes

- name: Stop and reset snapd service
  shell: |
    podman exec {{ item }} bash -c "
      systemctl stop snapd.service snapd.socket || true
      systemctl reset-failed snapd.service snapd.socket || true
    "
  loop:
    - gym-jinni-node1
    - gym-jinni-node2
    - gym-jinni-node3
  changed_when: false

- name: Enable and start snapd in containers
  shell: podman exec {{ item }} systemctl enable --now snapd.socket
  loop:
    - gym-jinni-node1
    - gym-jinni-node2
    - gym-jinni-node3
  register: snapd_enable
  failed_when: snapd_enable.rc != 0 and 'already enabled' not in snapd_enable.stderr
  changed_when: snapd_enable.rc == 0

- name: Wait for snapd to be ready
  shell: podman exec {{ item }} snap wait system seed.loaded
  loop:
    - gym-jinni-node1
    - gym-jinni-node2
    - gym-jinni-node3
  retries: 10
  delay: 5
  register: result
  until: result.rc == 0

- name: Configure AppArmor in containers
  shell: |
    podman exec {{ item }} bash -c "
      mkdir -p /sys/kernel/security/apparmor
      systemctl restart apparmor || true
      aa-status || true
    "
  loop:
    - gym-jinni-node1
    - gym-jinni-node2
    - gym-jinni-node3
  changed_when: false
  ignore_errors: yes

- name: Display container status
  debug:
    msg: "Podman containers created and ready for MicroK8s installation"

