---
- name: Ensure container build directory exists
  file:
    path: "{{ playbook_dir }}/../container"
    state: directory
    mode: '0755'

- name: Build main service container image
  shell: |
    cd {{ playbook_dir }}/../../
    sudo podman build -f k8s-setup/container/Dockerfile.service -t gym-jinni/service:latest .
  args:
    chdir: "{{ playbook_dir }}/../../"
  register: build_service
  changed_when: >-
    'Successfully tagged' in (build_service.stdout | default('') ~ build_service.stderr | default(''))
    or 'successfully tagged' in (build_service.stdout | default('') ~ build_service.stderr | default('')) | lower

- name: Build UI container image
  shell: |
    cd {{ playbook_dir }}/../../
    sudo podman build -f k8s-setup/container/Dockerfile.ui -t gym-jinni/ui:latest .
  args:
    chdir: "{{ playbook_dir }}/../../"
  register: build_ui
  changed_when: >-
    'Successfully tagged' in (build_ui.stdout | default('') ~ build_ui.stderr | default(''))
    or 'successfully tagged' in (build_ui.stdout | default('') ~ build_ui.stderr | default('')) | lower

- name: Import images into k3d cluster
  shell: sudo -E k3d image import {{ item }} -c gym-jinni
  environment:
    DOCKER_HOST: "{{ k3d_docker_host }}"
  loop:
    - gym-jinni/service:latest
    - gym-jinni/ui:latest
  register: import_result
  changed_when: import_result.rc == 0

- name: Display build status
  debug:
    msg: "All container images built and imported to k3d cluster"
