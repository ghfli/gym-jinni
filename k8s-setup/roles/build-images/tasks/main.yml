---
- name: Ensure build directory exists
  file:
    path: "{{ playbook_dir }}/../docker"
    state: directory
    mode: '0755'

- name: Build main service Docker image
  shell: |
    cd {{ playbook_dir }}/../../
    sudo docker build -f k8s-setup/docker/Dockerfile.service -t gym-jinni/service:latest .
  args:
    chdir: "{{ playbook_dir }}/../../"
  register: build_service
  changed_when: "'Successfully tagged' in build_service.stdout or 'Successfully built' in build_service.stdout"

- name: Build UI Docker image
  shell: |
    cd {{ playbook_dir }}/../../
    sudo docker build -f k8s-setup/docker/Dockerfile.ui -t gym-jinni/ui:latest .
  args:
    chdir: "{{ playbook_dir }}/../../"
  register: build_ui
  changed_when: "'Successfully tagged' in build_ui.stdout or 'Successfully built' in build_ui.stdout"

- name: Import images into k3d cluster
  shell: sudo k3d image import {{ item }} -c gym-jinni
  loop:
    - gym-jinni/service:latest
    - gym-jinni/ui:latest
  register: import_result
  changed_when: import_result.rc == 0

- name: Display build status
  debug:
    msg: "All Docker images built and imported to k3d cluster"

