---
- name: Ensure container build directory exists
  file:
    path: "{{ playbook_dir }}/../container"
    state: directory
    mode: '0755'

- name: Build main service container image
  shell: |
    cd {{ playbook_dir }}/../../
    sudo docker build -f k8s-setup/container/Dockerfile.service -t gym-jinni/service:latest .
  args:
    chdir: "{{ playbook_dir }}/../../"
  register: build_service
  changed_when: >-
    'Successfully tagged' in (build_service.stdout | default('') ~ build_service.stderr | default(''))
    or 'successfully tagged' in (build_service.stdout | default('') ~ build_service.stderr | default('')) | lower

- name: Import service image into k3d cluster
  shell: sudo -E k3d image import gym-jinni/service:latest -c gym-jinni
  environment:
    DOCKER_HOST: "{{ k3d_docker_host }}"
  register: import_result
  changed_when: import_result.rc == 0

- name: Display service build status
  debug:
    msg: "Main service container image built and imported to k3d cluster"

- name: Restart main-service deployment to pick up new image
  shell: |
    export KUBECONFIG="{{ ansible_env.HOME }}/.kube/gym-jinni-config"
    kubectl rollout restart deployment main-service -n gym-jinni || true
  register: rollout_result
  changed_when: "'restarted' in rollout_result.stdout"
