---
- name: Set deployment kubeconfig
  ansible.builtin.set_fact:
    kubeconfig_path: "{{ ansible_facts['env']['HOME'] }}/.kube/gym-jinni-config"

- name: Create private rendered release directory
  ansible.builtin.tempfile:
    state: directory
    prefix: gym-jinni-release-
  register: rendered_release

- name: Render and deploy local imported images
  block:
    - name: Render local release
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ role_path }}/../../scripts/render-release.py"
          - --profile
          - local
          - --domain
          - "{{ gym_jinni_domain }}"
          - --output
          - "{{ rendered_release.path }}"
      changed_when: false

    - name: Provision local application namespace
      ansible.builtin.command:
        argv: [kubectl, apply, -f, "{{ role_path }}/../../manifests/namespace.yml"]
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: namespace_result
      changed_when: "'created' in namespace_result.stdout or 'configured' in namespace_result.stdout"

    - name: Deploy after release migration
      ansible.builtin.command:
        argv: [bash, "{{ role_path }}/../../scripts/deploy-release.sh", "{{ rendered_release.path }}"]
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: release_result
      changed_when: "'created' in release_result.stdout or 'configured' in release_result.stdout"
  always:
    - name: Remove rendered development credentials
      ansible.builtin.file:
        path: "{{ rendered_release.path }}"
        state: absent
