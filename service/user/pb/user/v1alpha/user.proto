
syntax="proto3";

package user.v1alpha;

import "google/type/datetime.proto";
import "google/api/annotations.proto";
import "validator/v1alpha/validator.proto";

message User {
    int32  id = 1;
    string email = 2 [(validator.v1alpha.field) = {msg_exists: true, string_not_empty: true}];
    string phone = 3 [(validator.v1alpha.field) = {msg_exists: true, string_not_empty: true, regex: "^[0-9]{3,15}$"}];
    string name = 4 [(validator.v1alpha.field) = {msg_exists: true, string_not_empty: true}];
    string passwd = 5 [(validator.v1alpha.field) = {msg_exists: true, string_not_empty: true}];
}

message CreateUserRequest {
    User user = 1;
}

message CreateUserResponse {
    User user = 1;
}

message LoginUserRequest {
    User user = 1;
}

message LoginUserResponse {
    User user = 1;
    string session_id = 2;
    string access_tkn = 3;
    string refresh_tkn = 4;
    google.type.DateTime access_tkn_exp_at = 5;
    google.type.DateTime refresh_tkn_exp_at = 6;
}

message GetUserRequest {
    User user = 1;
    string session_id = 2;
    string access_tkn = 3;
}

message GetUserResponse {
    User user = 1;
    google.type.DateTime created_at = 2;
    bool email_verified = 3;
    bool phone_verified = 4;
    google.type.DateTime passwd_changed_at = 5;
}

message UpdateUserRequest {
    User user = 1;
    string session_id = 2;
    string access_tkn = 3;
    string new_passwd = 4;
}

message UpdateUserResponse {
    User user = 1;
}

message DeleteUserRequest {
    User user = 1;
    string session_id = 2;
    string access_tkn = 3;
}

message DeleteUserResponse {
    User user = 1;
}

message LogoutUserRequest {
    User user = 1;
    string session_id = 2;
    string access_tkn = 3;
}

message LogoutUserResponse {
    User user = 1;
    string session_id = 2;
}

message RenewAccessTokenRequest {
    string refresh_tkn = 1 [(validator.v1alpha.field) = {msg_exists: true, string_not_empty: true}];
}

message RenewAccessTokenResponse {
    string access_tkn = 1;
    google.type.DateTime access_tkn_exp_at = 2;
}

service UserService {
    rpc CreateUser (CreateUserRequest) returns (CreateUserResponse) {
        option (google.api.http) = {
            post: "/v1/create_user"
            body: "*"
        };
    }
    rpc LoginUser (LoginUserRequest) returns (LoginUserResponse) {
        option (google.api.http) = {
            post: "/v1/login_user"
            body: "*"
        };
    }
    rpc GetUser (GetUserRequest) returns (GetUserResponse) {
        option (google.api.http) = {
            get: "/v1/users/{user.id}"
        };
    }
    rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse) {
        option (google.api.http) = {
            put: "/v1/users/{user.id}"
            body: "*"
        };
    }
    rpc RenewAccessToken (RenewAccessTokenRequest) returns (RenewAccessTokenResponse) {
        option (google.api.http) = {
            post: "/v1/renew_token"
            body: "*"
        };
    }
    rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse) {
        option (google.api.http) = {
            delete: "/v1/users/{user.id}"
        };
    }
    rpc LogoutUser (LogoutUserRequest) returns (LogoutUserResponse) {
        option (google.api.http) = {
            post: "/v1/logout_user"
            body: "*"
        };
    }
    rpc GetTrainerProfile (GetTrainerProfileRequest) returns (GetTrainerProfileResponse) {
        option (google.api.http) = {
            get: "/v1/users/{user_id}/trainer_profile"
        };
    }
    rpc UpdateTrainerProfile (UpdateTrainerProfileRequest) returns (UpdateTrainerProfileResponse) {
        option (google.api.http) = {
            put: "/v1/trainer_profile"
            body: "*"
        };
    }
    rpc ListTrainers (ListTrainersRequest) returns (ListTrainersResponse) {
        option (google.api.http) = {
            get: "/v1/trainers"
        };
    }
}

message TrainerProfile {
    int32 user_id = 1;
    string bio = 2;
    repeated string specializations = 3;
    repeated string certifications = 4;
    int32 hourly_rate = 5;
}

message GetTrainerProfileRequest {
    int32 user_id = 1;
}

message GetTrainerProfileResponse {
    TrainerProfile profile = 1;
}

message UpdateTrainerProfileRequest {
    TrainerProfile profile = 1;
}

message UpdateTrainerProfileResponse {
    TrainerProfile profile = 1;
}

message ListTrainersRequest {}

message ListTrainersResponse {
    repeated TrainerProfile profiles = 1;
}
