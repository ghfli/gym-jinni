syntax = "proto3";

package notification.v1alpha;

import "google/type/datetime.proto";
import "google/api/annotations.proto";

message Notification {
    int32 id = 1;
    int32 user_id = 2;
    string type = 3;
    string channel = 4;
    string title = 5;
    string body = 6;
    bool is_read = 7;
    google.type.DateTime created_at = 8;
}

message Preference {
    int32 id = 1;
    int32 user_id = 2;
    string channel = 3;
    bool enabled = 4;
}

message SendNotificationRequest {
    int32 user_id = 1;
    string type = 2;
    string channel = 3;
    string title = 4;
    string body = 5;
}

message SendNotificationResponse {
    Notification notification = 1;
}

message ListNotificationsRequest {
    int32 user_id = 1;
}

message ListNotificationsResponse {
    repeated Notification notifications = 1;
}

message MarkReadRequest {
    int32 id = 1;
}

message MarkReadResponse {}

message GetPreferencesRequest {
    int32 user_id = 1;
}

message GetPreferencesResponse {
    repeated Preference preferences = 1;
}

message UpdatePreferenceRequest {
    int32 user_id = 1;
    string channel = 2;
    bool enabled = 3;
}

message UpdatePreferenceResponse {
    Preference preference = 1;
}

service NotificationService {
    rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse) {
        option (google.api.http) = {
            post: "/v1/notifications"
            body: "*"
        };
    }

    rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse) {
        option (google.api.http) = {
            get: "/v1/users/{user_id}/notifications"
        };
    }

    rpc MarkRead(MarkReadRequest) returns (MarkReadResponse) {
        option (google.api.http) = {
            post: "/v1/notifications/{id}/read"
        };
    }

    rpc GetPreferences(GetPreferencesRequest) returns (GetPreferencesResponse) {
        option (google.api.http) = {
            get: "/v1/users/{user_id}/notification_preferences"
        };
    }

    rpc UpdatePreference(UpdatePreferenceRequest) returns (UpdatePreferenceResponse) {
        option (google.api.http) = {
            put: "/v1/notification_preferences"
            body: "*"
        };
    }
}
